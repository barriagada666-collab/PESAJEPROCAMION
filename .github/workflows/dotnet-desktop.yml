name: .NET 10 Desktop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore PesajeProCamion.sln

    - name: Build solution (${{ matrix.configuration }})
      run: dotnet build PesajeProCamion.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Run automated portable, unit, stress, and UI tests (excluding local Firebird/GDB server fixture tests)
      run: >
        dotnet test PesajeProCamion.sln
        --configuration ${{ matrix.configuration }}
        --no-build
        --filter "FullyQualifiedName!~Ods9BinaryReader_ReadsAllTablesFromRealLegacyDatabase&FullyQualifiedName!~Ods9Migrator_MigratesAndCleansAllDataIntoRealFirebird25&FullyQualifiedName!~FirebirdMigratedDatabase_ConcurrentQueriesAndBatchInserts_StayFastAndLeakFree&FullyQualifiedName!~EndToEnd_CommercialAndMopWeighing_And_RegressionBugs_WorkCleanly"

    - name: Publish portable self-contained win-x64 (Release)
      if: matrix.configuration == 'Release'
      run: |
        dotnet publish src/PesajeProCamion.App/PesajeProCamion.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/portable-win-x64
        Set-Content -Path publish/portable-win-x64/portable.flag -Value "PesajeProCamion Portable Mode"

    - name: Upload portable build artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: PesajeProCamion-Portable-win-x64
        path: publish/portable-win-x64
